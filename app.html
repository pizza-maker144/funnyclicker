<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-приложение</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            padding: 24px;
            font-family: system-ui, sans-serif;
            background: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #e2e8f0);
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app {
            max-width: 560px;
            width: 100%;
            text-align: center;
        }

        .banner {
            width: 100%;
            border-radius: 20px;
            display: block;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        p {
            color: var(--tg-theme-hint-color, #94a3b8);
            line-height: 1.6;
            margin-bottom: 12px;
        }

        button {
            margin-top: 12px;
            padding: 14px 28px;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            background: var(--tg-theme-button-color, #6366f1);
            color: var(--tg-theme-button-text-color, #ffffff);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="app">
        <img src="banner.svg" alt="Кликер" class="banner">
        <h1>Привет из мини-приложения</h1>
        <p>Это обычная веб-страница, но открывается она внутри Telegram. Она знает, кто её открыл, и подстраивается под тему пользователя.</p>
        <p id="user"></p>
        <button id="close">Закрыть</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
        if (user) {
            document.getElementById("user").textContent =
                "Привет, " + (user.first_name || "друг") + "!";
        }

        document.getElementById("close").addEventListener("click", () => {
            tg.close();
        });
    </script>
</body>
</html>
